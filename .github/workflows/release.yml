name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Derive release version
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "ROKU_RELEASE_VERSION=$version" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Check version files
        run: ./scripts/sync-version.sh --check "$ROKU_RELEASE_VERSION"

      - name: Run tests
        run: npm test

      - name: Check release package
        run: npm run release:check

      - name: Package release asset
        run: ./scripts/package-release.sh --skip-build

      - name: Derive package file
        run: |
          # shellcheck disable=SC2016
          package_file="$(node -p 'const pkg=require("./package.json"); `${pkg.name.replace(/^@/, "").replace(/\//g, "-")}-${process.env.ROKU_RELEASE_VERSION}.tgz`')"
          test -f "dist/release/${package_file}"
          echo "ROKU_PACKAGE_FILE=$package_file" >> "$GITHUB_ENV"

      - name: Write release notes
        run: |
          printf '%s\n' \
            "roku ${ROKU_RELEASE_VERSION}" \
            "" \
            "Assets:" \
            "- \`${ROKU_PACKAGE_FILE}\`: npm package tarball" \
            "- \`SHA256SUMS.txt\`: SHA-256 checksum for the tarball" \
            "" \
            "Install:" \
            "- \`npm install -g ./${ROKU_PACKAGE_FILE}\`" \
            > dist/release/RELEASE_NOTES.md

      - name: Publish GitHub release
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              "dist/release/${ROKU_PACKAGE_FILE}" \
              dist/release/SHA256SUMS.txt \
              --clobber
            gh release edit "$GITHUB_REF_NAME" \
              --draft=false \
              --title "$GITHUB_REF_NAME" \
              --notes-file dist/release/RELEASE_NOTES.md
          else
            gh release create "$GITHUB_REF_NAME" \
              "dist/release/${ROKU_PACKAGE_FILE}" \
              dist/release/SHA256SUMS.txt \
              --title "$GITHUB_REF_NAME" \
              --notes-file dist/release/RELEASE_NOTES.md
          fi

      - name: Publish npm package
        run: |
          package_name="$(node -p 'require("./package.json").name')"

          if npm view "${package_name}@${ROKU_RELEASE_VERSION}" version >/dev/null 2>&1; then
            echo "${package_name}@${ROKU_RELEASE_VERSION} already exists on npm"
            exit 0
          fi

          npm publish "dist/release/${ROKU_PACKAGE_FILE}" --access public
